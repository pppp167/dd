<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#303790">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>ThaID Full Feature</title>

  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+Sans+TH:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    (function markHomeScreenApp() {
      const standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches;
      if (standalone) document.documentElement.classList.add('is-home-screen-app');
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      margin: 0;
      background: #303790;
      overflow: hidden;
    }

    #privacy-screen {
      position: fixed;
      top: -20px; left: -20px; right: -20px; bottom: -20px;
      z-index: 2147483647;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: none;
      background: rgba(255, 255, 255, 0.01);
    }

    #privacy-screen.is-visible {
      opacity: 1;
      visibility: visible;
      -webkit-backdrop-filter: blur(32px);
      backdrop-filter: blur(32px);
    }

    body {
      font-family: 'LINE Seed Sans TH', 'Prompt', sans-serif;
      width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: auto;
      max-height: none;
      max-width: none;
      width: auto;
      border: none;
      border-radius: 0;
      background: #303790;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      overflow: hidden;
    }

    input[type="file"] { display: none; }

    header {
      color: white;
      background: #303790;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      padding: max(calc(env(safe-area-inset-top) + 4px), 40px) 20px 8px 20px;
      padding-left: clamp(10px, 3vw, 18px);
      isolation: isolate;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    html.is-home-screen-app header {
      padding-top: calc(env(safe-area-inset-top) + 22px);
    }

    #top-edge-strip { display: none; }
    html.is-home-screen-app #top-edge-strip {
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(env(safe-area-inset-top) + 12px);
      background-color: #303790;
      pointer-events: none;
      z-index: 60;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 12px; }

    .avatar-container { position: relative; cursor: pointer; border-radius: 50%; }
    .avatar-container:active { transform: scale(0.95); }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; background-color: #ccc;
      background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.3);
      background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80');
    }

    .user-text p { font-size: 13px; color: #e2e8f0; font-weight: 400; margin-bottom: 2px; display: flex; align-items: center; gap: 6px;}
    .user-text h1 { font-size: 17px; font-weight: 600; margin-top: 0; letter-spacing: -0.2px;}

    .header-icons { display: flex; gap: 12px; font-size: 18px; }
    .header-icons i {
      width: 42px; height: 42px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .header-icons i:active { background: rgba(0, 0, 0, 0.4); }

    .online-badge {
      background: #22c55e; color: white; font-size: 9px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px; margin-left: 2px;
      display: inline-flex; align-items: center; gap: 4px; vertical-align: middle;
      letter-spacing: 0.5px;
    }
    .online-dot { width: 4px; height: 4px; background: white; border-radius: 50%; }

    .main-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .main-scroll-area::-webkit-scrollbar { display: none; }

    .blue-section {
      padding: 0 clamp(18px, 4vw, 24px) 10px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .card-wrapper {
      width: 100%;
      max-width: none;
      height: auto;
      aspect-ratio: 1.58 / 1;
      perspective: 1000px;
      position: relative;
      margin-top: 0;
    }

    .card-inner {
      width: 100%; height: 100%;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d; position: relative; cursor: pointer;
    }
    .card-inner.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); overflow: hidden; background: #fff;
    }
    .card-back { transform: rotateY(180deg); }

    .card-image { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }

    .lock-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.22);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      border-radius: 12px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }
    .lock-icon-svg { width: 56px; height: 56px; fill: #333; margin-bottom: 12px; }
    .lock-text { font-size: 17px; font-weight: 600; color: #333; }

    .card-action-bar {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .card-action-btn {
      background: rgba(12, 20, 91, 0.82);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
      font-family: inherit;
    }

    .card-action-btn:active {
      transform: scale(0.95);
    }

    .card-action-btn.icon-only {
      padding: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }

    .white-section {
      flex: 1;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      margin-top: 8px;
      padding-top: 24px;
      position: relative;
      z-index: 20;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 16px 20px; }
    .section-title h2 { font-size: 17px; color: #333; font-weight: 700; }
    .section-title a { font-size: 13px; color: #888; text-decoration: none; font-weight: 500;}

    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; }
    .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; cursor: pointer; }

    .menu-icon {
      width: 56px; height: 56px;
      background: #eceef2;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
    }
    .menu-icon svg {
      width: 30px; height: 30px;
      stroke: #303790; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .menu-item span { font-size: 13px; color: #4b5563; line-height: 1.3; font-weight: 500;}

    .carousel-wrapper {
      overflow-x: auto;
      scrollbar-width: none;
      margin-top: 20px;
      padding: 0;
      position: relative;
    }
    .carousel-wrapper::-webkit-scrollbar { display: none; }

    .carousel-track { display: flex; gap: 12px; width: max-content; padding: 0 10%; }

    .banner {
      flex: 0 0 auto; border-radius: 12px; overflow: hidden;
      position: relative; height: 70px; background: #e5e7eb; cursor: pointer;
    }

    .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100
